name: groupctl verification

on:
  push:
    branches: [main, synthesis/groupctl-final]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unit, integration and regression tests
        run: python -m unittest discover -s tests -v
      - name: Fifteen-step collaboration simulation
        run: python scripts/demo.py
      - name: Installed CLI
        run: |
          python -m pip install --no-deps .
          groupctl --version
