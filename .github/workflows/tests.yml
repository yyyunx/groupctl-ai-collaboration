name: groupctl verification

on:
  push:
    branches: [main, synthesis/groupctl-final, 'feature/**', 'improvement/**', 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  distribution:
    uses: ./.github/workflows/verify-distribution.yml
    with:
      revision: ${{ github.sha }}
