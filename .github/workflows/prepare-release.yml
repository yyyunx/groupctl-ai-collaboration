name: Prepare verified draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main to test and build exactly
        required: true
        default: v0.3.2
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: ref
        name: Resolve candidate from an existing tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/verify-distribution.yml
    with:
      revision: ${{ needs.resolve.outputs.sha }}
      tag: ${{ inputs.tag }}

  draft:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: groupctl-dist
          path: dist
      - name: Recheck exact tag and original artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/check_version.py --tag "$RELEASE_TAG"
          python scripts/check_artifacts.py --verify --tag "$RELEASE_TAG"
      - name: Create draft only; never edit or publish an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$EXPECTED_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG — Distribution preparation" --notes-file "docs/releases/$RELEASE_TAG.md" dist/*
