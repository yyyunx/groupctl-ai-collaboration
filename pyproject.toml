[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "groupctl"
dynamic = ["version"]
description = "Vendor-neutral Git group collaboration helper, protocol 0.1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
keywords = ["git", "collaboration", "students", "agents", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Version Control :: Git",
]
# Scope and excluded historical teaching materials: docs/LICENSING_REVIEW.md.

[project.urls]
Homepage = "https://github.com/yyyunx/groupctl-ai-collaboration"
Repository = "https://github.com/yyyunx/groupctl-ai-collaboration"
Issues = "https://github.com/yyyunx/groupctl-ai-collaboration/issues"
Changelog = "https://github.com/yyyunx/groupctl-ai-collaboration/blob/main/CHANGELOG.md"

[project.scripts]
groupctl = "groupctl.__main__:main"

[tool.setuptools.packages.find]
include = ["groupctl*"]

[tool.setuptools.dynamic]
version = {attr = "groupctl.__version__"}

[tool.setuptools.package-data]
groupctl = ["agent_data/*.md", "agent_data/skill/*.md", "agent_data/skill/references/*.md"]
